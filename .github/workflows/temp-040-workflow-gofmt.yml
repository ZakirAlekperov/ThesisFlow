name: Temporary 0.4.0 formatter
on:
  push:
    branches: [feature/0.4.0-complete-review-workflow]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/0.4.0-complete-review-workflow
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Format Go changes
        run: |
          gofmt -w internal/reviewqueue/repository.go internal/web/review_queue_page.go internal/web/review_queue_040_test.go internal/web/document_preview.go internal/web/document_preview_040_test.go internal/web/handler.go internal/web/document_workflow.go internal/web/document_card.go internal/web/dashboard.go internal/web/student_page.go cmd/thesisflow/main.go
          git config user.name "ThesisFlow CI"
          git config user.email "thesisflow-ci@users.noreply.github.com"
          if ! git diff --quiet; then
            git add internal/reviewqueue internal/web cmd/thesisflow
            git commit -m "style: gofmt 0.4.0 review queue and preview"
            git push origin HEAD:feature/0.4.0-complete-review-workflow
          fi
