name: Temporary formatting for migration branch
on:
  push:
    branches: [feature/0.1.11-sqlite-migrations]
permissions:
  contents: write
jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/0.1.11-sqlite-migrations
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Format branch files and commit
        run: |
          gofmt -w .
          git config user.name "ThesisFlow CI"
          git config user.email "thesisflow-ci@users.noreply.github.com"
          if ! git diff --quiet; then
            git add -u
            git commit -m "style: apply gofmt to SQLite migration"
            git push origin HEAD:feature/0.1.11-sqlite-migrations
          fi
