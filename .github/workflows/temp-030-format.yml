name: Temporary 0.3.0 Go formatter
on:
  push:
    branches:
      - feature/0.3.0-thesis-workspace
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/0.3.0-thesis-workspace
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Format and push Go changes
        run: |
          gofmt -w internal/web/document_workflow.go internal/web/document_card.go internal/web/document_card_030_test.go
          git config user.name "ThesisFlow CI"
          git config user.email "thesisflow-ci@users.noreply.github.com"
          if ! git diff --quiet; then
            git add internal/web/document_workflow.go internal/web/document_card.go internal/web/document_card_030_test.go
            git commit -m "style: gofmt ThesisFlow 0.3.0 thesis workspace"
            git push origin HEAD:feature/0.3.0-thesis-workspace
          fi
