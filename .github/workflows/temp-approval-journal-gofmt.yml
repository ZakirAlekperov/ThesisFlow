name: Temporary approval journal gofmt
on:
  push:
    branches: [feature/0.6.0-reliability-implementation]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/0.6.0-reliability-implementation
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Apply gofmt
        run: |
          gofmt -w internal/review/service.go internal/review/journal.go internal/review/journal_test.go internal/workspace/audit.go internal/backup/backup.go internal/backup/verify_060_test.go cmd/thesisflow/main.go
          git config user.name "ThesisFlow CI"
          git config user.email "thesisflow-ci@users.noreply.github.com"
          if ! git diff --quiet; then
            git add internal cmd
            git commit -m "style: format durable approval recovery"
            git push origin HEAD:feature/0.6.0-reliability-implementation
          fi
