name: Temporary 0.6 orphan formatter
on:
  push:
    branches: [feature/0.6.0-orphan-audit-hardening]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/0.6.0-orphan-audit-hardening
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: |
          gofmt -w internal/workspace/inventory.go internal/workspace/inventory_test.go internal/workspace/audit.go internal/web/workspace_health.go
          git config user.name "ThesisFlow CI"
          git config user.email "thesisflow-ci@users.noreply.github.com"
          if ! git diff --quiet; then
            git add internal
            git commit -m "style: format orphan inventory"
            git push origin HEAD:feature/0.6.0-orphan-audit-hardening
          fi
