# Compile distributable, CGO-free ThesisFlow binaries.
# Сборка переносимых двоичных файлов ThesisFlow без CGO.
name: Portable builds

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: windows
            goarch: amd64
          - goos: linux
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build and package
        id: package
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          binary=thesisflow
          if [ "$GOOS" = windows ]; then binary=thesisflow.exe; fi
          go build -trimpath -ldflags="-s -w" -o "dist/$binary" ./cmd/thesisflow
          cp README.md LICENSE dist/
          package="thesisflow-$GOOS-$GOARCH"
          if [ "$GOOS" = windows ]; then
            cp packaging/windows/install.ps1 packaging/windows/uninstall.ps1 dist/
            (cd dist && zip -q "../$package.zip" "$binary" README.md LICENSE install.ps1 uninstall.ps1)
            echo "archive=$package.zip" >> "$GITHUB_OUTPUT"
          elif [ "$GOOS" = darwin ]; then
            tar -czf "$package.tar.gz" -C dist "$binary" README.md LICENSE
            mkdir -p ThesisFlow.app/Contents/MacOS
            cp dist/thesisflow ThesisFlow.app/Contents/MacOS/thesisflow
            chmod 755 ThesisFlow.app/Contents/MacOS/thesisflow
            cp packaging/macos/Info.plist ThesisFlow.app/Contents/Info.plist
            zip -qr "$package-app.zip" ThesisFlow.app
            echo "archive=$package.tar.gz" >> "$GITHUB_OUTPUT"
          else
            tar -czf "$package.tar.gz" -C dist "$binary" README.md LICENSE
            mkdir -p debroot/DEBIAN debroot/usr/local/bin
            cp dist/thesisflow debroot/usr/local/bin/thesisflow
            chmod 755 debroot/usr/local/bin/thesisflow
            printf 'Package: thesisflow\nVersion: 0.4.0~dev\nSection: education\nPriority: optional\nArchitecture: amd64\nMaintainer: ThesisFlow developers <maintainers@localhost>\nDescription: Local graduation thesis document management app\n' > debroot/DEBIAN/control
            chmod 755 debroot/DEBIAN
            dpkg-deb --build debroot "$package.deb"
            echo "archive=$package.tar.gz" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify package contents
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          package="thesisflow-$GOOS-$GOARCH"
          if [ "$GOOS" = windows ]; then
            unzip -t "$package.zip"
            unzip -Z -1 "$package.zip" | grep -qx 'install.ps1'
            unzip -Z -1 "$package.zip" | grep -qx 'uninstall.ps1'
          elif [ "$GOOS" = darwin ]; then
            unzip -t "$package-app.zip"
            unzip -Z -1 "$package-app.zip" | grep -qx 'ThesisFlow.app/Contents/Info.plist'
            unzip -Z -1 "$package-app.zip" | grep -qx 'ThesisFlow.app/Contents/MacOS/thesisflow'
          else
            dpkg-deb --info "$package.deb"
            dpkg-deb --contents "$package.deb" | grep -q 'usr/local/bin/thesisflow'
          fi
      - name: Save portable build
        uses: actions/upload-artifact@v4
        with:
          name: thesisflow-${{ matrix.goos }}-${{ matrix.goarch }}
          path: thesisflow-${{ matrix.goos }}-${{ matrix.goarch }}*
          if-no-files-found: error
