name: Temporary XLSX format
on:
  push:
    branches: [feature/0.1.13-xlsx-sheet-selection]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/0.1.13-xlsx-sheet-selection
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Apply gofmt
        run: |
          gofmt -w .
          git config user.name "ThesisFlow CI"
          git config user.email "thesisflow-ci@users.noreply.github.com"
          if ! git diff --quiet; then
            git add -u
            git commit -m "style: format named-sheet XLSX support"
            git push origin HEAD:feature/0.1.13-xlsx-sheet-selection
          fi
