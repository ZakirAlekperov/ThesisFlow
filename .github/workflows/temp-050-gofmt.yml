name: Temporary ThesisFlow 0.5 formatter
on:
  push:
    branches: [feature/0.5.0-analytics-implementation]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/0.5.0-analytics-implementation
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt and commit
        run: |
          gofmt -w internal/analytics/ internal/reportexport/ internal/materials/repository.go internal/statusmatrix/matrix.go internal/web/analytics_page.go internal/web/analytics_050_test.go internal/web/handler.go internal/web/dashboard.go cmd/thesisflow/main.go cmd/thesisflow/version.go cmd/thesisflow/version_test.go
          git config user.name "ThesisFlow CI"
          git config user.email "thesisflow-ci@users.noreply.github.com"
          if ! git diff --quiet; then
            git add internal cmd/thesisflow
            git commit -m "style: format ThesisFlow 0.5 analytics"
            git push origin HEAD:feature/0.5.0-analytics-implementation
          fi
