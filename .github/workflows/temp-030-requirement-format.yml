name: Temporary 0.3 requirements formatter
on:
  push:
    branches: [feature/0.3.0-edit-requirements]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/0.3.0-edit-requirements
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt Go changes
        run: |
          gofmt -w internal/requirements/update.go internal/requirements/update_test.go internal/web/requirement_edit.go internal/web/requirement_edit_test.go internal/web/student_page.go internal/web/handler.go
          git config user.name "ThesisFlow CI"
          git config user.email "thesisflow-ci@users.noreply.github.com"
          if ! git diff --quiet; then
            git add internal/requirements/ internal/web/
            git commit -m "style: format requirement editing"
            git push origin HEAD:feature/0.3.0-edit-requirements
          fi
