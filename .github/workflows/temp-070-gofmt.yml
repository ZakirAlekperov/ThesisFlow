name: Temporary 0.7 formatter
on:
  push:
    branches: [feature/0.7.0-teacher-workflow-implementation]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/0.7.0-teacher-workflow-implementation
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt and push
        run: |
          gofmt -w internal/workspace internal/profiles internal/schedule internal/userassets internal/requirements/repository.go internal/storage/migrate/migrate.go internal/analytics/report.go internal/web/profiles_page.go internal/web/calendar_page.go internal/web/assets_page.go internal/web/profile_transfer_page.go internal/web/handler.go internal/web/student_page.go internal/web/templates.go cmd/thesisflow/main.go cmd/thesisflow/version.go cmd/thesisflow/version_test.go
          git config user.name "ThesisFlow CI"
          git config user.email "thesisflow-ci@users.noreply.github.com"
          if ! git diff --quiet; then
            git add internal cmd/thesisflow
            git commit -m "style: gofmt 0.7 teacher workflow"
            git push origin HEAD:feature/0.7.0-teacher-workflow-implementation
          fi
