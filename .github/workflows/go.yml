# Continuous integration for ThesisFlow.
# Непрерывная интеграция проекта ThesisFlow.
name: Go checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Format, test and vet
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # TEMPORARY: generate reproducible dependency lockfiles for the first SQLite dependency.
      - name: Bootstrap SQLite dependency lockfiles
        shell: bash
        run: |
          go mod tidy
          echo '===THESISFLOW_GO_MOD_START==='
          cat go.mod
          echo '===THESISFLOW_GO_MOD_END==='
          echo '===THESISFLOW_GO_SUM_START==='
          cat go.sum
          echo '===THESISFLOW_GO_SUM_END==='

      - name: Check Go formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These Go files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run tests
        run: go test ./...

      - name: Check with go vet
        run: go vet ./...
