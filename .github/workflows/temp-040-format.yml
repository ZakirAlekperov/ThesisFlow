name: Temporary 0.4.0 review formatter
on:
  push:
    branches:
      - feature/0.4.0-document-review
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/0.4.0-document-review
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Go formatting
        run: |
          gofmt -w internal/review/feedback.go internal/review/feedback_test.go internal/review/service.go internal/web/document_workflow.go internal/web/document_card.go internal/web/handler.go internal/web/review_feedback_040_test.go cmd/thesisflow/version.go cmd/thesisflow/version_test.go
          git config user.name "ThesisFlow CI"
          git config user.email "thesisflow-ci@users.noreply.github.com"
          if ! git diff --quiet; then
            git add internal/review internal/web cmd/thesisflow
            git commit -m "style: format ThesisFlow 0.4.0 review changes"
            git push origin HEAD:feature/0.4.0-document-review
          fi
