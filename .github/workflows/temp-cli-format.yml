name: Temporary CLI formatting
on:
  push:
    branches: [feature/0.1.10-backup-cli-release]
permissions:
  contents: write
jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/0.1.10-backup-cli-release
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Apply gofmt
        run: |
          gofmt -w .
          git config user.name "ThesisFlow CI"
          git config user.email "thesisflow-ci@users.noreply.github.com"
          if ! git diff --quiet; then
            git add -u
            git commit -m "style: format backup CLI"
            git push origin HEAD:feature/0.1.10-backup-cli-release
          fi
