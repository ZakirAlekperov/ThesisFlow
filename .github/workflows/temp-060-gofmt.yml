name: Temporary ThesisFlow 0.6 formatter
on:
  push:
    branches: [feature/0.6.0-reliability-implementation]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/0.6.0-reliability-implementation
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt and commit
        run: |
          gofmt -w internal/workspace/*.go internal/backup/backup.go internal/backup/verify_060_test.go cmd/thesisflow/backup_command.go cmd/thesisflow/doctor.go cmd/thesisflow/doctor_test.go cmd/thesisflow/main.go cmd/thesisflow/version.go cmd/thesisflow/version_test.go internal/web/workspace_health.go internal/web/workspace_health_060_test.go internal/web/backup_settings.go internal/web/handler.go
          git config user.name "ThesisFlow CI"
          git config user.email "thesisflow-ci@users.noreply.github.com"
          if ! git diff --quiet; then
            git add internal cmd
            git commit -m "style: gofmt ThesisFlow 0.6 reliability code"
            git push origin HEAD:feature/0.6.0-reliability-implementation
          fi
