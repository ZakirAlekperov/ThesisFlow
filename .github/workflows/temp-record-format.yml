name: Temporary formatting management
on:
  push:
    branches: [feature/0.1.12-record-editing]
permissions:
  contents: write
jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/0.1.12-record-editing
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Format and commit
        run: |
          gofmt -w .
          git config user.name "ThesisFlow CI"
          git config user.email "thesisflow-ci@users.noreply.github.com"
          if ! git diff --quiet; then
            git add -u
            git commit -m "style: gofmt group and student management"
            git push origin HEAD:feature/0.1.12-record-editing
          fi
