name: Temporary workspace selector formatter
on:
  push:
    branches: [feature/0.6.0-workspace-selector-ui]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/0.6.0-workspace-selector-ui
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Apply gofmt
        run: |
          gofmt -w internal/workspaceselect/*.go internal/web/workspace_selection_page.go internal/web/workspace_selection_060_test.go internal/web/handler.go internal/web/backup_settings.go internal/web/backup_restore.go cmd/thesisflow/main.go cmd/thesisflow/workspace_command.go cmd/thesisflow/workspace_choice_060_test.go
          git config user.name "ThesisFlow CI"
          git config user.email "thesisflow-ci@users.noreply.github.com"
          if ! git diff --quiet; then
            git add internal cmd
            git commit -m "style: gofmt restored workspace selection"
            git push origin HEAD:feature/0.6.0-workspace-selector-ui
          fi
